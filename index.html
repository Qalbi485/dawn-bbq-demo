<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0e1013" />
  <title>Dawn — Order Online</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="phone">
    <header class="app-top">
      <div class="brand">
        <div class="brand-logo"><img src="img/logo.png" alt="Dawn BBQ Restaurant" /></div>
        <div>
          <b id="rName">Dawn BBQ Restaurant</b>
          <small id="rTag">Pizza, BBQ &amp; Fast Food</small>
        </div>
      </div>
      <span class="status">OPEN NOW</span>
    </header>

    <!-- ============ MENU ============ -->
    <main class="view active" id="viewMenu">
      <div class="hero-note">
        Demo app — your order goes straight to the restaurant's WhatsApp.
        <a href="admin.html">View admin side →</a>
      </div>
      <div class="chips" id="chips"></div>
      <div id="menuList"></div>
    </main>

    <!-- ============ CART ============ -->
    <main class="view" id="viewCart">
      <div id="cartContent"></div>
    </main>

    <!-- floating cart bar -->
    <button class="cart-bar" id="cartBar" type="button">
      <div>
        <b id="barCount">0 items</b><br />
        <span id="barTotal">₨ 0</span>
      </div>
      <i>→</i>
    </button>

    <!-- tabbar -->
    <nav class="tabbar">
      <button class="tab active" data-tab="menu" type="button"><span class="ic">🍽️</span>Menu</button>
      <button class="tab" data-tab="cart" type="button">
        <span class="ic">🛒</span>Cart
        <span class="tab-badge" id="cartBadge">0</span>
      </button>
    </nav>

    <div class="toast" id="toast"></div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
